  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(3px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}
.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
:root {
  --bg: #050508;
  --surface: #0a0a12;
  --panel: rgba(16, 16, 28, 0.72);
  --line: rgba(0, 255, 204, 0.22);
  --hell: #ff2a12;
  --nc: #00ffcc;
  --k81: #ffcc00;
  --ink: #e8e8f0;
  --muted: #888898;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050508;
    --surface: #0a0a12;
    --panel: rgba(16, 16, 28, 0.72);
    --line: rgba(0, 255, 204, 0.22);
    --hell: #ff2a12;
    --nc: #00ffcc;
    --k81: #ffcc00;
    --ink: #e8e8f0;
    --muted: #888898;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: "JetBrains Mono", Consolas, "Courier New", monospace;
}
.grid-bg {
  background-image:
    linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
}
.glass {
  background: var(--panel);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
}
@keyframes pulseNode {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255, 42, 18, 0.55);
  }
  50% {
    box-shadow: 0 0 18px 4px rgba(255, 42, 18, 0.55);
  }
}
.node-active {
  animation: pulseNode 1.2s ease-in-out infinite;
}
@keyframes scanline {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(400%);
  }
}
input[type="range"] {
  accent-color: var(--nc);
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:h-\[420px\] {
    height: 420px;
  }
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 768px) {
  .md\:inline {
    display: inline;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .lg\:grid-cols-\[240px_1fr_300px\] {
    grid-template-columns: 240px 1fr 300px;
  }
}
